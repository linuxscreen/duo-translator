<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_NAME% — Options</title>
    <meta name="manifest.type" content="browser_action" />
    <!-- Open settings in a full tab, not embedded in about:addons. Firefox
         forbids permissions.request() from an options page embedded inside
         about:addons (throws "may only be called from a user input handler"),
         which breaks the WebDAV host-permission prompt. A real tab fixes it. -->
    <meta name="manifest.open_in_tab" content="true" />
    <!-- Fonts are self-hosted in public/fonts and declared in assets/fonts.css
         (imported by options.css) — no fonts.googleapis.com request. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
