name: duo-translator

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Override release notes (Markdown, single-line here). Normally leave empty: notes are taken from CHANGELOG.md, falling back to GitHub-generated notes. Community contributors are appended automatically.'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create the release as a draft'
        required: false
        type: boolean
        default: true

jobs:
  build-duo:
    permissions:
      contents: read
    environment: production
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Get version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      - name: Generate .env from GitHub Environment
        run: |
          cat > .env << 'EOF'
          VITE_APP_NAME=${{ vars.VITE_APP_NAME || 'Duo Translator' }}
          VITE_APP_NAME_KEBAB_CASE=${{ vars.VITE_APP_NAME_KEBAB_CASE || 'duo-translator' }}
          VITE_APP_NAME_PASCAL_CASE=${{ vars.VITE_APP_NAME_PASCAL_CASE || 'DuoTranslator' }}
          VITE_WEBSITE=${{ vars.VITE_WEBSITE || 'https://duotranslator.com' }}
          VITE_GITHUB_URL=${{ vars.VITE_GITHUB_URL || 'https://github.com/linuxscreen/duo-translator' }}
          VITE_GOOGLE_API_KEY=${{ secrets.VITE_GOOGLE_API_KEY }}
          VITE_GOOGLE_CLIENT_ID_CHROME=${{ secrets.VITE_GOOGLE_CLIENT_ID_CHROME }}
          VITE_GOOGLE_CLIENT_ID_WEB=${{ secrets.VITE_GOOGLE_CLIENT_ID_WEB }}
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & zip (Chrome)
        run: pnpm zip

      - name: Build & zip (Firefox)
        run: pnpm zip:firefox

      # Only the web extension payload is built here; build-safari wraps it into
      # the signed, notarized app and dmg on a Mac. Building it on this job keeps
      # a single .env (and its secrets) and spares the Mac a dependency install.
      - name: Build (Safari payload)
        run: pnpm build:safari

      - name: Zip (Edge, reuse Chrome build)
        run: cp .output/duo-translator-$VERSION-chrome.zip .output/duo-translator-$VERSION-edge.zip

      # .output is a dot-directory, which upload-artifact skips by default:
      # without include-hidden-files the glob matches nothing and the step
      # only warns, leaving the release job without the zips.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duo-translator-${{ env.VERSION }}
          path: .output/*.zip
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Safari payload
        uses: actions/upload-artifact@v4
        with:
          name: safari-payload
          path: .output/safari-mv3
          include-hidden-files: true
          if-no-files-found: error

  # Signed + notarized installer: `pnpm safari:dist --prebuilt`, see
  # scripts/safari.mjs. The raw web extension zip is NOT released any more —
  # Safari cannot load it without this wrapping, which needs Xcode on a Mac.
  #
  # Required secrets in the `production` environment:
  #   SAFARI_DEVELOPER_ID_P12           "Developer ID Application" certificate
  #                                     WITH its private key, exported from
  #                                     Keychain Access as .p12, base64-encoded
  #                                     (`base64 -i cert.p12 | pbcopy`)
  #   SAFARI_DEVELOPER_ID_P12_PASSWORD  the password set on that export
  #   APPLE_API_KEY_P8                  App Store Connect API key (.p8 file
  #                                     contents, as is) — notarization only,
  #                                     so the "Developer" role is enough
  #   APPLE_API_KEY_ID                  its key id
  #   APPLE_API_ISSUER_ID               the issuer id shown above the key list
  # Standard GitHub-hosted macOS runners are free for public repositories.
  build-safari:
    needs: build-duo
    permissions:
      contents: read
    environment: production
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.build-duo.outputs.version }}
    steps:
      - name: Check signing secrets
        env:
          SAFARI_DEVELOPER_ID_P12: ${{ secrets.SAFARI_DEVELOPER_ID_P12 }}
          SAFARI_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.SAFARI_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=""
          for n in SAFARI_DEVELOPER_ID_P12 SAFARI_DEVELOPER_ID_P12_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the 'production' environment:$missing"
            exit 1
          fi

      # Full history: the Xcode build number is the commit count
      # (stampVersion in scripts/safari.mjs); a shallow clone would stamp 1.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The project uses Xcode 26 build settings (SWIFT_APPROACHABLE_CONCURRENCY,
      # SWIFT_DEFAULT_ACTOR_ISOLATION); older Xcodes fail to build it.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download Safari payload
        uses: actions/download-artifact@v4
        with:
          name: safari-payload
          path: .output/safari-mv3

      # A throwaway keychain on the search list, holding only the Developer ID
      # identity, so codesign finds it without a password prompt. The Developer
      # ID G2 intermediate is imported too: a .p12 exported from Keychain
      # Access carries only the leaf, and codesign needs the full chain.
      - name: Import Developer ID certificate
        env:
          P12: ${{ secrets.SAFARI_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.SAFARI_DEVELOPER_ID_P12_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | xargs)
          security find-identity -v -p codesigning "$KEYCHAIN"
          printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign & notarize dmg
        env:
          SAFARI_SIGNING_IDENTITY: Developer ID Application
          SAFARI_NOTARY_KEY: ${{ runner.temp }}/AuthKey.p8
          SAFARI_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          SAFARI_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: node scripts/safari.mjs dist --prebuilt

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: duo-translator-${{ env.VERSION }}-safari
          path: safari/build/dist/duo-translator-${{ env.VERSION }}-safari.dmg
          if-no-files-found: error

      - name: Remove signing material
        if: ${{ always() }}
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  # Separate from the build jobs so the release is created only once every
  # asset exists — a failed Safari signing never leaves a release without its dmg.
  release:
    needs: [build-duo, build-safari]
    permissions:
      contents: write
      pull-requests: read
    environment: production
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build-duo.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: duo-translator-${{ env.VERSION }}*
          path: dist
          merge-multiple: true

      - name: Prepare release notes
        id: notes
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CONTRIBUTOR_EXCLUDE: ${{ vars.RELEASE_CONTRIBUTOR_EXCLUDE }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          if [ -n "$RELEASE_NOTES" ]; then
            printf '%s\n' "$RELEASE_NOTES" > "$NOTES_FILE"
          elif [ -f CHANGELOG.md ]; then
            # Extract the "## [<version>]" section (Keep a Changelog format)
            awk -v ver="$VERSION" '
              /^## /{ if (found) exit; if (index($0, "[" ver "]")) found=1; next }
              found
            ' CHANGELOG.md > "$NOTES_FILE"
          fi
          if [ -s "$NOTES_FILE" ]; then
            node scripts/appendReleaseContributors.mjs "$NOTES_FILE" "v$VERSION" "$GITHUB_SHA"
            echo "body_path=$NOTES_FILE" >> $GITHUB_OUTPUT
            echo "generate=false" >> $GITHUB_OUTPUT
          else
            echo "body_path=" >> $GITHUB_OUTPUT
            echo "generate=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
          files: |
            dist/duo-translator-${{ env.VERSION }}-chrome.zip
            dist/duo-translator-${{ env.VERSION }}-firefox.zip
            dist/duo-translator-${{ env.VERSION }}-edge.zip
            dist/duo-translator-${{ env.VERSION }}-safari.dmg
            dist/duo-translator-${{ env.VERSION }}-sources.zip
          fail_on_unmatched_files: true
          draft: ${{ inputs.draft }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
